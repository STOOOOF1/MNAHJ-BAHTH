<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>بطاقات مناهج البحث الاقتصادي</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#14302f;--teal:#0f5c5a;--teal2:#1b7f7a;--tealL:#e3f1ef;--gold:#b8892f;--goldL:#f7efdc;--rose:#9c3d3d;--roseL:#f6e6e3;--gray:#5d6b6a;--line:#cfe0dd;--bg:#f3f7f6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:Tajawal,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:620px;margin:0 auto;padding:14px 14px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
header h1{font-size:19px;font-weight:900;color:var(--teal);line-height:1.3}
header h1 small{display:block;font-size:12.5px;font-weight:500;color:var(--gray)}
button{font-family:inherit;cursor:pointer;border:none}
.menuBtn{background:#fff;border:1px solid var(--line);color:var(--teal);font-weight:700;border-radius:12px;padding:9px 13px;font-size:15px;white-space:nowrap}
.prog{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.prog .row{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:6px}
.bar{height:8px;background:var(--tealL);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal2),var(--gold));border-radius:99px;transition:width .4s}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.lv{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:8px 5px 7px;text-align:center;color:var(--ink)}
.lv small{display:block;font-size:11.5px;color:var(--gray);font-weight:700}.lv b{display:block;font-size:13px;font-weight:800;color:var(--teal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv span{display:block;font-size:12px;color:var(--gray);margin:2px 0 5px}
.lv .bar{height:4px}
.lv.on{border-color:var(--teal);background:var(--tealL)}
.lv.lock{opacity:.5}
.lv .badge{position:absolute;top:-7px;left:-5px;background:var(--gold);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;font-weight:800}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 24px rgba(15,92,90,.10);overflow:hidden;animation:pop .35s ease}
.card::before{content:"";display:block;height:6px;background:linear-gradient(90deg,var(--teal),var(--gold))}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.cin{padding:16px 18px 18px}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chap{background:var(--goldL);color:#7a5a16;font-weight:700;font-size:13px;border-radius:99px;padding:3px 11px}
.pos{font-size:13px;color:var(--gray)}
.card h2{font-size:21px;font-weight:800;color:var(--teal);line-height:1.45;margin-bottom:10px}
.body{font-size:16.5px;line-height:1.85}
.body b{color:var(--teal)}
.body .k{background:var(--teal);color:#fff;border-radius:6px;padding:0 6px;font-weight:700}
.body .v{color:#7a5a16;font-weight:700}
.body table{width:100%;border-collapse:collapse;font-size:14.5px;line-height:1.55;margin:6px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.body th{background:var(--teal);color:#fff;padding:5px 7px;text-align:right}
.body td{padding:5px 7px;border-top:1px solid var(--line);vertical-align:top}
.body td:first-child{font-weight:700;color:var(--teal)}
.body tr:nth-child(even) td{background:#f5faf9}
.done-tag{display:inline-block;background:var(--tealL);color:var(--teal);font-size:12px;font-weight:800;border-radius:99px;padding:2px 9px}
.acts{display:flex;gap:8px;margin-top:14px}
.ok{flex:1;background:var(--teal);color:#fff;font-size:17px;font-weight:800;border-radius:14px;padding:14px}
.ok:active{transform:scale(.98)}
.later{background:#fff;border:1.5px solid var(--line);color:var(--teal);font-weight:700;border-radius:14px;padding:12px 16px;font-size:15px}
.sub{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:14px;color:var(--gray)}
.link{background:none;color:var(--teal2);font-weight:700;font-size:14px;padding:4px}
.link:disabled{opacity:.35}
.finish{text-align:center;padding:28px 20px}
.finish .em{font-size:54px}.finish h2{margin:8px 0 6px}.finish p{color:var(--gray);font-size:16px;line-height:1.7;margin-bottom:16px}
.finish .ok{display:block;width:100%;margin-bottom:8px}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:15px;font-weight:700;transition:.3s;pointer-events:none;z-index:50;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheetBg{position:fixed;inset:0;background:rgba(10,30,30,.45);opacity:0;pointer-events:none;transition:.25s;z-index:30}
.sheetBg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:620px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;max-height:80vh;display:flex;flex-direction:column;transform:translateY(105%);transition:.3s;z-index:40}
.sheet.show{transform:none}
.sheet .hd{padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.sheet .grip{width:44px;height:5px;background:var(--line);border-radius:99px;margin:0 auto 10px}
.sheet .hd h3{font-size:17px;color:var(--teal);display:flex;justify-content:space-between;align-items:center}
.sheet .list{overflow:auto;padding:6px 10px}
.it{display:flex;gap:9px;align-items:center;width:100%;background:none;text-align:right;padding:10px 8px;border-bottom:1px solid #eef4f3;font-size:15px;color:var(--ink)}
.it .st{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:#fff}
.it.d .st{background:var(--teal);border-color:var(--teal)}
.it.cur{background:var(--goldL);border-radius:10px}
.it small{display:block;color:var(--gray);font-size:12px}
.sheet .ft{padding:10px 16px 16px;border-top:1px solid var(--line)}
.reset{width:100%;background:var(--roseL);color:var(--rose);font-weight:700;border-radius:12px;padding:11px;font-size:15px}
.confirm{display:none;margin-top:8px;gap:8px}.confirm.show{display:flex}
.confirm button{flex:1;border-radius:12px;padding:10px;font-weight:700;font-size:15px}
.confirm .y{background:var(--rose);color:#fff}.confirm .n{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
footer{text-align:center;color:var(--gray);font-size:12.5px;margin-top:18px;line-height:1.7}
</style></head><body>
<div class="wrap">
<header><h1>بطاقات مناهج البحث الاقتصادي<small>ماجستير الاقتصاد الإسلامي · الجامعة الإسلامية</small></h1><button class="menuBtn" id="menuBtn">☰ القائمة</button></header>
<div class="prog"><div class="row"><span>التقدم الكلي</span><span id="totTxt"></span></div><div class="bar"><i id="totBar"></i></div></div>
<div class="levels" id="levels"></div>
<div id="main"></div>
<footer>تقدّمك محفوظ في هذا المتصفح فقط · المحتوى من مذكرة المقرر، وعبارات «حفظ» و«لا تخلط» إضافات للمراجعة</footer>
</div>
<div class="sheetBg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="hd"><div class="grip"></div><h3><span id="shTitle"></span><button class="link" id="shClose">إغلاق ✕</button></h3></div><div class="list" id="shList"></div>
<div class="ft"><button class="reset" id="resetBtn">إعادة تعيين تقدّم هذا المستوى</button><div class="confirm" id="confirm"><button class="y" id="yes">نعم، أعد التعيين</button><button class="n" id="no">تراجع</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const LEVELS=[{n:1,name:"الصورة الكبرى"},{n:2,name:"المفاهيم"},{n:3,name:"التفاصيل"},{n:4,name:"الإتقان"}];
const C=[
// ===================== المستوى 1: الصورة الكبرى (10) =====================
[1,"المدخل","ما البحث العلمي؟ ولماذا ندرس مناهجه؟","<span class='k'>البحث العلمي</span> عملية <b>منظمة</b> لجمع البيانات وتحليلها للوصول إلى حلول للمشكلات واكتساب معارف جديدة موثقة.<br>ندرس مناهجه لنقلّص الفجوة مع المجتمعات المتقدمة، ولأنه طريقة منظمة لحل المشكلات يحتاجها <b>كل الناس</b> لا الباحثون وحدهم."],
[1,"المدخل","إلى أين يريد البحث أن يصل؟","للبحث سلّم أهداف يتصاعد: <b>الوصف ← التفسير ← التنبؤ ← الضبط ← التطبيق</b>.<br>يبدأ بوصف الظاهرة، ثم معرفة أسبابها، ثم توقّع مستقبلها، ثم <span class='k'>ضبطها</span> وهو أهم الأهداف، ثم تحويل المعرفة إلى تطبيقات."],
[1,"الخصائص والأخلاق","ما الذي يجعل البحث «علميًا»؟","ثلاث دوائر:<br>• <b>خصائص</b> في البحث نفسه (الموضوعية، التعميم، التراكمية…)<br>• <b>أركان</b> لا يقوم إلا بها: الموضوع، الهدف، المنهجية، الشكل<br>• <b>أخلاقيات</b> في الباحث وسلوكه: الأمانة، الحياد، احترام العينة…"],
[1,"أنواع البحوث","كيف تُصنَّف البحوث؟","ثلاثة تقسيمات متداخلة:<br>• بحسب <b>الطبيعة</b>: نظرية وتطبيقية<br>• بحسب <b>الغرض</b>: استكشافية ووصفية وتفسيرية<br>• بحسب <b>البيانات</b>: نوعية وكمية ومختلطة"],
[1,"المناهج","المناهج الثلاثة الكبرى","يختار الباحث منهجه حسب <b>زمن</b> المشكلة:<br>• <span class='k'>الوصفي</span> للظاهرة المعاصرة كما هي<br>• <span class='k'>التاريخي</span> للماضي وجذوره<br>• <span class='k'>التجريبي</span> لإدخال تغيير وقياس أثره والتنبؤ"],
[1,"الموضوع والمشكلة","رحلة بناء خطة البحث","تمشي الخطة بهذا الترتيب:<br><b>الموضوع ← المشكلة ← العنوان ← الأسئلة ← الأهداف ← الفرضيات ← الأهمية والحدود</b>.<br>كل خطوة تخرج من التي قبلها؛ فالأسئلة نابعة من المشكلة، والأهداف موازية للأسئلة."],
[1,"المتغيرات والفرضيات","قلب البحث: المتغيرات والفرضيات","المفاهيم المجردة تتحول إلى <span class='k'>متغيرات</span> قابلة للقياس، وأهمها: <b>المستقل</b> (السبب) و<b>التابع</b> (النتيجة).<br>و<span class='k'>الفرضية</span> حل مؤقت يتوقع علاقة بين متغيرين ويُختبر بالبيانات."],
[1,"مصادر المعرفة","من أين نأخذ المعرفة؟","في الإسلام ثلاثة مصادر متكاملة: <b>النقل (الوحي) والعقل والحس</b>، بخلاف مذاهب حصرت المعرفة في واحد منها.<br>والاقتصاد الإسلامي يستمد من مصادر الشريعة: القرآن والسنة والاجتهاد، ثم كتب التراث والخبرات الإنسانية النافعة."],
[1,"جمع البيانات والعينات","كيف نحصل على البيانات؟","بأدوات أربع: <b>المقابلة، الاستبانة، الملاحظة، الوثائق</b>، ونتحقق من كفاءة الأداة بـ<b>الصدق والثبات</b>.<br>ونأخذها من <b>عينة</b> تمثل مجتمع الدراسة: احتمالية (عشوائية) أو غير احتمالية."],
[1,"التحليل والتوثيق","ماذا نفعل بالبيانات بعد جمعها؟","نمر بثلاث مراحل: <b>التهيئة ← التحليل ← التفسير</b>.<br>النوعية تُحلل بالبحث عن الأنماط، والكمية بالإحصاء الوصفي والاستدلالي. ثم نوثّق كل ما نقلناه بأمانة في الحاشية وقائمة المراجع."],

// ===================== المستوى 2: المفاهيم (20) =====================
[2,"المدخل","تعريف البحث العلمي وخصائص التعريف","<b>التعريف:</b> عملية منظمة لجمع البيانات والمعلومات وتحليلها للوصول إلى إجابات أو حلول للأسئلة أو المشكلات التي تواجه الأفراد والمجتمعات، واكتساب معارف جديدة وموثقة.<br><b>تشترك التعريفات في:</b><br>١) أنه عملية منظمة تتبع منهجًا (يُخرج الطرق غير العلمية)<br>٢) يهدف إلى حقائق أو إجابات أو حلول<br>٣) فيه اختبار وفحص منظم للمعلومات"],
[2,"الخصائص","خصائص البحث العلمي السبع","١) الموضوعية<br>٢) وجود هدف وغاية<br>٣) القابلية للإثبات والتكرار<br>٤) القابلية للتعميم<br>٥) القدرة على التنبؤ<br>٦) التراكمية<br>٧) التنظيم"],
[2,"الخصائص","أركان البحث الأربعة","لا يقوم البحث إلا بها:<br>١) <b>موضوع البحث</b><br>٢) <b>هدف البحث</b><br>٣) <b>منهجية البحث</b><br>٤) <b>شكل البحث</b>"],
[2,"الأخلاقيات","أخلاقيات البحث السبع","١) الأمانة والصدق والنزاهة<br>٢) العمل البحثي الدقيق والمنظم<br>٣) الحياد والموضوعية<br>٤) احترام مجهودات الآخرين وملكياتهم الفكرية<br>٥) التعامل الأخلاقي مع عينة الدراسة<br>٦) النشر العلمي المسؤول<br>٧) الالتزام بالقوانين الشرعية والأعراف"],
[2,"الأخلاقيات","صفات الباحث الست","١) الرغبة والميول الشخصية<br>٢) الإلمام بموضوع البحث<br>٣) الأمانة العلمية<br>٤) الذكاء وسرعة البديهة<br>٥) الصبر والتأني<br>٦) التواضع وتقبل النقد العلمي"],
[2,"أنواع البحوث","النظرية والتطبيقية","<span class='k'>النظرية</span> (الأساسية/المجردة): هدفها الحقيقة وتطوير النظريات والمفاهيم، وتعتمد <b>التأمل والعمل العقلي</b> لا التجريب.<br><span class='k'>التطبيقية</span>: هدفها <b>حل مشكلات</b> المؤسسات والمجتمعات في سياق محدد، كأبحاث التسويق."],
[2,"أنواع البحوث","الاستكشافية والوصفية والتفسيرية","• <b>الاستكشافية:</b> لفهم مشكلة قليلة المعلومات أو غير واضحة.<br>• <b>الوصفية:</b> تصف الظاهرة بدقة وتجيب عن ماذا ومتى وأين وكيف.<br>• <b>التفسيرية:</b> تجيب عن <b>لماذا؟</b> بفروض سببية بين المتغيرات."],
[2,"أنواع البحوث","النوعي والكمي والمختلط","• <span class='k'>النوعي (الكيفي)</span>: بيانات نوعية من مشاهدات وآراء وتعليقات.<br>• <span class='k'>الكمي</span>: جمع البيانات الرقمية وتحليلها لاختبار الفرضيات.<br>• <span class='k'>المختلط</span>: جمع الكمي والكيفي ومزجهما في دراسة واحدة لفهم أشمل."],
[2,"المناهج","ما المنهجية؟ وكيف أختارها؟","<b>المنهجية:</b> الأسلوب والطريقة التي يتبعها الباحث في الكشف عن الحقيقة والإجابة عن أسئلته؛ وهي خطة لمراحل البحث وقراراته.<br><b>أسئلة الاختيار:</b><br>• هل المشكلة في الماضي أم الحاضر أم المستقبل؟<br>• هل البحث في المكتبة أم في الميدان؟<br>• هل الهدف الوصف أم التفسير والتنبؤ؟"],
[2,"المناهج","المنهج الوصفي وأنواعه","<b>تعريفه:</b> دراسة الظاهرة <b>كما هي على أرض الواقع</b> ووصفها بدقة وبيان أبعادها ومتغيراتها، بطرق كمية وكيفية.<br><b>أنواعه الستة:</b> المسحي · التتبعي · الارتباطي · الميداني (الحقلي) · تحليل المحتوى · دراسة الحالة."],
[2,"المناهج","المنهج التاريخي والمنهج التجريبي","<span class='k'>التاريخي</span>: يسجل أحداث الماضي ويحللها علميًا ليفسر الماضي ويفهم الحاضر ويتنبأ بالمستقبل، معتمدًا على السجلات والوثائق.<br><span class='k'>التجريبي</span>: يستخدم التجربة (مختبرية أو ميدانية) لإثبات الفروض، مع <b>ضبط</b> العوامل الأخرى غير العامل التجريبي لقياس أثره على التابع."],
[2,"الموضوع والمشكلة","ما المشكلة البحثية؟","اعتقاد الباحث أن كمية المعارف المتاحة عن ظاهرة <b>غير كافية لفهمها</b> فهمًا مقنعًا.<br>فهي: غموض، أو ظاهرة تحتاج تفسيرًا، أو تساؤل محيّر، أو قضية خلافية.<br><b>جوهرها:</b> الافتقار إلى المعرفة أو عدم اليقين (حسن، 1997)."],
[2,"المتغيرات","المتغير والمستقل والتابع","<b>المتغير</b> عكس الثابت: سمة لظاهرة تأخذ قيمًا مختلفة من حالة إلى أخرى (العمر، الدخل).<br>• <span class='k'>المستقل</span>: المؤثر، كالسبب، ويسبق التابع.<br>• <span class='k'>التابع</span>: المتأثر، النتيجة أو الاستجابة."],
[2,"الفرضيات","ما الفرضية؟","حلول محتملة للمشكلة أو تفسير مقترح لها، أو <b>جملة أو حكم مؤقت يتضمن علاقة بين متغيرين أو أكثر، قابل للاختبار</b> (حافظ، 2012).<br>تُوضع بعد تحديد المشكلة والاطلاع على الإطار النظري والدراسات السابقة."],
[2,"مصادر المعرفة","العلم والمعرفة ومصادرها","<b>المعرفة:</b> إدراك الشيء على ما هو عليه، مسبوقة بجهل. <b>العلم:</b> العلم بالشيء المطابق للواقع.<br>العلم جزء من المعرفة، وليست كل معرفة علمًا.<br><b>مصادر المعرفة في الإسلام:</b> <span class='k'>النقل</span> و<span class='k'>العقل</span> و<span class='k'>الحس</span>."],
[2,"جمع البيانات","مصادر البيانات وأداة جمعها","• <b>الثانوية:</b> بيانات جاهزة جمعتها جهة أخرى ونشرتها (نشرات الوزارات، الرسائل، الكتب).<br>• <b>الأولية (الميدانية):</b> يجمعها الباحث بنفسه من العينة.<br><b>أداة جمع البيانات:</b> الوسيلة التي تُجمع بها البيانات وتُسجل لتحليلها واختبار الفروض. أهمها: المقابلة، الاستبانة، الملاحظة، الوثائق."],
[2,"جمع البيانات","الصدق والثبات","<span class='k'>الصدق Validity</span>: أن يقيس المقياس فعلًا <b>ما وُضع لقياسه</b>، لا شيئًا آخر.<br><span class='k'>الثبات Reliability</span>: خلو المقاييس من الأخطاء العشوائية، فتعطي <b>النتائج نفسها</b> عند تكرار القياس."],
[2,"العينات","المجتمع والعينة ونوعا المعاينة","<b>مجتمع الدراسة:</b> جميع الأفراد أو العناصر التي يدرسها الباحث ويعمم عليها.<br><b>العينة:</b> مجموعة جزئية من المجتمع تمثله.<br>• <b>الاحتمالية:</b> لكل عنصر احتمال <b>معروف وغير صفري</b> للاختيار.<br>• <b>غير الاحتمالية:</b> لا تعطي بعض العناصر فرصة، وتتدخل فيها رغبة الباحث."],
[2,"التحليل","مراحل تحليل البيانات","تحليل المعلومات: استخراج الأدلة الكمية والكيفية التي تبرهن على إجابة الأسئلة أو قبول الفرضيات.<br><b>ثلاث مراحل:</b><br>١) تهيئة البيانات (مراجعة، ترميز وتبويب، تفريغ)<br>٢) التحليل ذاته<br>٣) التفسير"],
[2,"التوثيق","التوثيق والاقتباس","<span class='k'>التوثيق</span>: إثبات مصادر المعلومات وإرجاعها إلى أصحابها، أمانةً واعترافًا بجهد الآخرين.<br><b>نوعاه:</b> في النص، وفي قائمة المراجع.<br><b>أشكال الاقتباس:</b> نصي، بالتلخيص، بإعادة الصياغة.<br>والطريقة المتبعة في الجامعة الإسلامية: <b>التوثيق في الحاشية</b>."],

// ===================== المستوى 3: التفاصيل (30) =====================
[3,"المدخل","أهداف البحث الخمسة بالتفصيل","١) <b>الوصف Description:</b> جمع بيانات الظاهرة وتصنيفها بالملاحظة.<br>٢) <b>التفسير Explanation:</b> اكتشاف أسبابها بالتحليل والمقارنة.<br>٣) <b>التنبؤ Prediction:</b> استعمال التعميمات لتوقع المستقبل.<br>٤) <b>الضبط Control:</b> ضبط العوامل المؤثرة — <b>أهم الأهداف والمحصلة النهائية</b>.<br>٥) <b>التطبيق Innovation:</b> تطبيقات عملية للمعرفة النظرية."],
[3,"المدخل","الظواهر الطبيعية مقابل الاجتماعية","<table><tr><th></th><th>الطبيعية</th><th>الاجتماعية</th></tr><tr><td>طبيعتها</td><td>ثابتة يمكن حصرها</td><td>متغيرة زمانًا ومكانًا</td></tr><tr><td>الموضوعية</td><td>الباحث محايد مع ظواهر جامدة</td><td>الباحث طرف فتدخل ميوله</td></tr><tr><td>التجربة</td><td>ممكنة وتتكرر</td><td>عزل الإنسان صعب وفيه إشكالات أخلاقية</td></tr></table>"],
[3,"المدخل","منهجية التفكير العلمي","١) الاعتماد على <b>الأدلة والبراهين</b>، لا التحيزات والرغبات.<br>٢) جمع الأدلة <b>ثم</b> الوصول للنتيجة، لا حمل فكرة مسبقة ثم البحث عن دليلها.<br>٣) فحص الارتباط و<b>عدم التسرع</b> بربط السبب بالنتيجة؛ فقد يكون التلازم صدفة، فلا بد من حصر المتغيرات وعزل العوامل."],
[3,"الأخلاقيات","مظاهر الأمانة والتعامل مع العينة","<b>مظاهر الأمانة والصدق:</b> الإشارة لمصدر كل معلومة · نشر النتائج الواقعية دون تزوير · عدم اختلاق معلومات · عدم المبالغة في التفسير.<br><b>التعامل مع العينة:</b> الحفاظ على سرية المعلومات · احترام رغبة الانسحاب دون ضغط · مصارحتهم بالمخاطر · أخذ <b>موافقة خطية</b> عند وجود خطر."],
[3,"أنواع البحوث","البحث الاستكشافي: متى وكيف ولماذا؟","<b>متى؟</b> حين تقل المعلومات أو لا تتضح المشكلة، وفي المراحل الأولى من البحث.<br><b>ميزته:</b> المرونة الإجرائية؛ يوجه الباحث بحثه حيث يتجه الموضوع.<br><b>أدواته:</b> المقابلات، المجموعات التركيزية، تحليل الاستبانات، تحليل المحتوى.<br><b>يستعمل لـ:</b> فهم أفضل · تحديد فرضيات للمستقبل · أفضل طريقة لجمع البيانات · تطوير أدوات القياس · تحديد المتغيرات."],
[3,"أنواع البحوث","خصائص المنهج النوعي","١) يتعرف على كمّ كبير من <b>وجهات النظر</b> يصعب التعبير عنها إحصائيًا.<br>٢) أساسه <b>التفاعل</b> بين الباحث والمبحوثين (مقابلة، ملاحظة، مشاهدة).<br>٣) يهتم بالتفاصيل الدقيقة والمنظور الشامل الكلي.<br>٤) يحتاج <b>وقتًا كبيرًا</b> مع أن عيناته صغيرة.<br>٥) العينة غير ممثلة إحصائيًا، يقررها الباحث حسب الهدف والسياق."],
[3,"أنواع البحوث","عيوب البحث النوعي","١) <b>ضعف الموثوقية</b> بسبب العوامل غير المنضبطة.<br>٢) <b>ذاتية الباحث</b> تغلب على الموضوعية لدوره في التحليل والتفسير.<br>٣) <b>تعميم محدود</b> لصغر العينات، ولا يتكرر بالنتيجة نفسها.<br>٤) <b>ثقل العمل وطوله</b> لأن التحليل غالبًا يدوي."],
[3,"أنواع البحوث","خصائص المنهج الكمي","١) يصلح للعينات الكبيرة الممثلة بدقة.<br>٢) أدواته <b>أكثر تنظيمًا</b> من أدوات المناهج الأخرى.<br>٣) أسئلة موضوعية واضحة وإجابات موضوعية.<br>٤) يسمح <b>بإعادة الدراسة وتكرارها</b> فيمنحها موثوقية.<br>٥) <b>تعميم واسع</b> وكشف للعلاقات وتنبؤ سهل.<br>هدفه الأساس: <b>اختبار الفرضيات</b>."],
[3,"أنواع البحوث","مبررات البحث المختلط","١) البيانات الكمية والنوعية متوفرة، ودمجها يقدم <b>فهمًا أفضل</b> للمشكلة.<br>٢) نوع واحد وحده <b>لا يكفي</b> لمعالجة المشكلة أو الإجابة عن أسئلتها.<br>٣) يريد <b>بناء أداة كمية</b> (استبانة) انطلاقًا من دراسة نوعية (مقابلات).<br>بدأ يُستخدم بتزايد منذ عام <b>1980</b> تقريبًا."],
[3,"أنواع البحوث","تصاميم البحث المختلط الثلاثة","• <span class='k'>الاستكشافي</span>: كيفي أولًا لاستكشاف الظاهرة ← ثم كمي لاختبار العلاقات وتأكيدها.<br>• <span class='k'>المثلّث (المتزامن)</span>: الكيفي والكمي <b>في الوقت نفسه</b> ثم الدمج.<br>• <span class='k'>التفسيري</span>: كمي أولًا وتحليل نتائجه ← ثم كيفي لفهمها وتفسيرها."],
[3,"المناهج","المناهج الثلاثة: الزمن والتدخل","<table><tr><th></th><th>الزمن</th><th>التدخل في الواقع</th></tr><tr><td>الوصفي</td><td>الحاضر</td><td>يدرسه كما هو</td></tr><tr><td>التاريخي</td><td>الماضي</td><td>يحلل السجلات والوثائق</td></tr><tr><td>التجريبي</td><td>المستقبل والتنبؤ</td><td>يعيد تشكيله بإدخال متغير</td></tr></table>الوصفي <b>الأكثر استخدامًا</b> في الدراسات الإنسانية لصعوبة التجريب على البشر."],
[3,"المناهج","قانون المتغير الواحد وطبيعة التجريب","<b>القانون:</b> موقفان متشابهان من كل الجوانب، يُضاف عنصر إلى أحدهما دون الآخر، فأي اختلاف يظهر يُعزى إلى العنصر المضاف (وكذلك عند الحذف).<br><b>طبيعة البحث التجريبي:</b><br>١) إحداث تغيير في الواقع (المتغير التجريبي) وملاحظة أثره على التابع.<br>٢) ضبط الإجراءات للتأكد من عدم تأثير عوامل أخرى."],
[3,"المناهج","مصطلحات البحث التجريبي","• <b>المجموعة التجريبية:</b> تتعرض للمتغير المستقل.<br>• <b>المجموعة الضابطة:</b> لا تتعرض له؛ أساس الحكم والمقارنة.<br>• <b>العوامل المؤثرة:</b> كل ما يؤثر في الموقف كالصفات والمهارات.<br>• <b>العامل المستقل (التجريبي):</b> الذي نريد معرفة أثره.<br>• <b>العامل التابع:</b> الذي نقيس فيه الأثر.<br>• <b>ضبط العوامل:</b> إبعاد أثر كل العوامل عدا التجريبي بعزلها."],
[3,"الموضوع والمشكلة","مراحل اختيار الموضوع الثلاث","١) <b>موضوع عام</b> ضمن اهتمامات الباحث، ويُحبّذ أن تكون له خبرة به.<br>٢) <b>فلترة الموضوع:</b> تضييقه من العام إلى الخاص موضوعًا أو مكانًا أو زمانًا.<br>٣) <b>تحديد السؤال الرئيس</b> وتحديد الكلمات الدالة والمتغيرات المستقلة والتابعة.<br>وتسبقها خطوة: <b>المراجعة المبدئية للأدبيات</b>."],
[3,"الموضوع والمشكلة","معايير اختيار الموضوع","١) حداثته وصلته بالواقع<br>٢) موافقته ميول الباحث ورغباته وخبرته<br>٣) أهميته وقيمته العلمية<br>٤) توفر المراجع العلمية اللازمة<br>٥) قدرة الباحث العلمية على دراسته والإحاطة بأبعاده<br>٦) إلمامه بمنهجية البحث وأدوات تحليل البيانات"],
[3,"الموضوع والمشكلة","الصياغة اللفظية والصياغة الاستفهامية","<span class='k'>اللفظية (الإخبارية/التقريرية)</span>: جملة خبرية أو أكثر بالأسلوب <b>القمعي (المخروطي)</b>: مقدمات عامة ← تعريف المشكلة ← أسبابها ← آثارها ← الحاجة للبحث.<br><span class='k'>الاستفهامية</span>: سؤال أو أسئلة يسعى البحث للإجابة عنها، تُبرز العلاقة بين المتغيرات وتكون قابلة للإجابة بالبيانات: كيف؟ لماذا؟ ما مدى تأثير؟ هل؟"],
[3,"الموضوع والمشكلة","معادلة المشكلة ومعايير صياغتها","<b>المعادلة:</b> موضوع محدد + ادعاء أو رأي واضح دقيق + أسباب تدعمه من الأدلة والنظريات = <span class='k'>مشكلة بحثية</span>.<br><b>معايير الصياغة:</b> توضيح الموضوع الرئيس · تحديد النقاط والمتغيرات · توضيح الأهمية وأسباب الاختيار · تحديد الفجوة والدراسات السابقة · توضيح الإضافة المرجوة · عبارات واضحة سهلة."],
[3,"الموضوع والمشكلة","صياغة العنوان","العنوان واجهة البحث وأول ما يُقرأ ويُصنف به في المكتبات وقواعد البيانات. معاييره ثلاثة:<br>١) <b>الدقة:</b> يعكس المضمون، ويتجنب الفضفاض.<br>٢) <b>الوضوح:</b> يعبّر عن المشكلة ولا يسبب لبسًا.<br>٣) <b>الإيجاز:</b> أقل الكلمات، لا قصير جدًا ولا طويل جدًا.<br>ويتضمن <b>المتغيرات ونوع الدراسة أو منهجيتها</b>."],
[3,"الموضوع والمشكلة","أسئلة البحث وأهدافه","<b>الأسئلة</b> نابعة من المشكلة (لا أسئلة الاستبانة)، وتوازي الأهداف؛ رئيسة (1–2) تتبعها فرعية.<br><b>أنواعها:</b> وصفي · عن علاقة ارتباط · عن علاقة تأثير.<br><b>معايير الأسئلة:</b> صلة مباشرة بالمشكلة · واضحة · قابلة للإجابة · قابلة للتحقق والقياس.<br><b>معايير الأهداف:</b> محددة · دقيقة · قابلة للتحقيق · توضح المتغيرات · بلا مبالغة."],
[3,"المتغيرات","تقسيمات المتغيرات الثلاثة","<b>١) باعتبار القيم:</b> كيفية (يعبر عنها بالكلمات، وتُرقّم للتصنيف بلا معنى: ذكر 1 أنثى 2) · كمية (الدخل، العمر، الأرباح).<br><b>٢) باعتبار التأثير:</b> مستقل · تابع.<br><b>٣) باعتبار التجريد:</b> ملحوظة تقاس مباشرة (الوزن، الطول، الحرارة) · مجردة لا تقاس مباشرة (الثقة، الرضا، الإبداع)."],
[3,"الفرضيات","متى نستخدم الفرضيات؟","<table><tr><th>الدراسة</th><th>تستخدم</th><th>السبب</th></tr><tr><td>الاستطلاعية</td><td>تساؤلات</td><td>لا يعرف هل العلاقة موجودة</td></tr><tr><td>الوصفية</td><td>أسئلة بحثية</td><td>العلاقة ثابتة في مجتمعات أخرى ويتأكد منها في مجتمعه</td></tr><tr><td>التجريبية</td><td>فرضيات لازمة</td><td>يعرف العلاقة ويريد شدتها واتجاهها</td></tr></table>"],
[3,"الفرضيات","الفرضيات الموجهة وغير الموجهة","<span class='k'>الموجهة</span>: يتوقع علاقة <b>باتجاه محدد</b> (إيجابية أو سلبية).<br>مثال: «زيادة معدلات التضخم تؤدي إلى انخفاض معدلات الادخار لدى الأفراد في الدول النامية».<br><span class='k'>غير الموجهة</span>: يثبت العلاقة <b>ولا يحدد اتجاهها</b>.<br>مثال: «هناك علاقة بين الإنفاق الحكومي ومعدل النمو الاقتصادي في الدول النامية»."],
[3,"الفرضيات","معايير الفرضية الجيدة","عناصر الفرض: المستقل + التابع + صفة العلاقة. ومعاييره:<br>١) الوضوح في المفاهيم والعلاقة<br>٢) الإيجاز<br>٣) الارتباط بالنظريات القائمة<br>٤) الخلو من التناقض<br>٥) علاقة بين <b>متغيرين فقط</b><br>٦) قابلة للاختبار وغير عامة يستحيل التحقق منها<br>٧) أساس منطقي من نظرية أو بحوث أو خبرة"],
[3,"مصادر المعرفة","العقل: معانيه وحدوده في الغيب","<b>معانيه الثلاثة:</b> ١) الغريزة، وبفقدها يسقط التكليف ٢) المعارف الفطرية الضرورية (الواحد نصف الاثنين، الحادث لا بد له من محدِث، الكل أكبر من الجزء) ٣) العلوم النظرية بالاستدلال، ويتفاوت فيها الناس.<br><b>في الغيب:</b> يثبت <span class='k'>الغيب المتعقَّل</span> (وجود الله، النبوة، البعث)، أما <span class='k'>الغيب المحض</span> (نعيم الجنة، أهوال القيامة) فلا يُعرف إلا بالخبر."],
[3,"مصادر المعرفة","مصادر الاقتصاد الإسلامي: الأصلية والتبعية","<b>الأصلية</b> (اتفق العلماء على الاحتجاج بها): القرآن · السنة · الإجماع · القياس.<br><b>التبعية</b> (اختلفوا في حجيتها، وترجع في الجملة للأصلية): الاستحسان · الاستصحاب · المصالح المرسلة · العرف · شرع من قبلنا · مذهب الصحابي · سد الذرائع."],
[3,"جمع البيانات","خطوات تصميم الاستبانة الخمس","١) تحديد هدفها في ضوء أهداف الدراسة.<br>٢) صياغة الأسئلة في قسمين: معلومات عامة عن المشارك ثم أسئلة الموضوع، ولا تكثر حتى لا يمل.<br>٣) <b>تحكيمها</b> من 2–4 خبراء ← يسمى <b>الصدق الظاهري</b>.<br>٤) <b>الاختبار المبدئي</b> على عينة مشابهة لاختبار <b>الثبات</b> ووضوح التعليمات والزمن.<br>٥) تطبيقها وتوزيعها (بريد، هاتف، فاكس، باليد، روابط إلكترونية)."],
[3,"العينات","العينات الاحتمالية الأربع","١) <b>العشوائية البسيطة:</b> مجتمع صغير متجانس مع إطار دقيق؛ بالقرعة أو جداول الأرقام العشوائية أو الحاسب.<br>٢) <b>المنتظمة:</b> ترقيم الإطار والاختيار على أبعاد ثابتة (5، 10، 15…).<br>٣) <b>الطبقية:</b> تقسيم المجتمع طبقات (العمر، الدخل) ثم الاختيار العشوائي من كل طبقة.<br>٤) <b>العنقودية:</b> اختيار <b>مجموعات لا أفراد</b>؛ للمجتمع المتفرق جغرافيًا."],
[3,"العينات","العينات غير الاحتمالية الأربع","١) <b>العمدية (الغرضية):</b> فئة تملك المعلومات؛ تكثر في الاستطلاعية.<br>٢) <b>الميسرة (المتاحة):</b> من يقابلهم الباحث؛ سهلة لكنها لا تمثل المجتمع.<br>٣) <b>كرة الثلج:</b> حين لا توجد قائمة بالمجتمع؛ كل مشارك يدل على غيره.<br>٤) <b>الحصصية quota:</b> فئات بنسب وجودها، ثم يختار الباحث الأفراد بنفسه.<br><b>ميزتها:</b> قلة التكلفة والسهولة. <b>عيبها:</b> التحيز وعدم التعميم."],
[3,"التحليل","أساليب تحليل البيانات النوعية","١) <b>تحليل المحتوى</b> (الأشيع): الأنماط المتكررة وتكرار الكلمات والأفكار؛ نوعاه: <b>الواضح</b> (المعنى الصريح) و<b>الكامن</b> (المعنى الضمني).<br>٢) <b>تحليل السياق:</b> البيانات في بيئتها من وقت ومكان وأشخاص.<br>٣) <b>تحليل القصة:</b> روايات المشاركين وتجاربهم الشخصية.<br>٤) <b>تحليل الخطاب:</b> كيف تُستخدم اللغة للتأثير والتعبير وبناء المعنى."],
[3,"التحليل","مقاييس النزعة المركزية والتشتت","<table><tr><th>المقياس</th><th>معناه</th></tr><tr><td>الوسط الحسابي</td><td>للكمية فقط، يتأثر بالقيم الشاذة</td></tr><tr><td>الوسيط</td><td>منتصف البيانات المرتبة، لا يتأثر، للترتيبية</td></tr><tr><td>المنوال</td><td>الأكثر تكرارًا، للوصفية والترتيبية</td></tr><tr><td>المدى</td><td>أكبر قيمة − أصغر قيمة، يتأثر بالشاذة</td></tr><tr><td>التباين</td><td>متوسط مربعات الانحرافات عن الوسط</td></tr><tr><td>الانحراف المعياري</td><td>الجذر التربيعي الموجب للتباين</td></tr><tr><td>معامل الاختلاف</td><td>مقياس نسبي للتشتت</td></tr></table>"],

// ===================== المستوى 4: الإتقان (40) =====================
[4,"المدخل","العلم: تعريفاته وأهمية البحث","اختلفت تعريفات العلم لاختلاف النظر إليه: كمٌّ من المعارف، أو طريقة في البحث والتفكير، أو مزيج منهما، ويضيف بعضهم <b>القيم والأخلاق</b>. وهو <b>ليس ثابتًا</b> بل نشاط إنساني يتطور.<br><b>أهمية البحث:</b> مُثرٍ للعلوم، والعلوم مثرية للمعارف: <span class='k'>المعارف</span> ⊃ <span class='k'>العلوم</span> ⊃ <span class='k'>البحوث</span>. يحل المشكلات ويكشف الأخطاء ويمنح الدول مكانة بين الأمم."],
[4,"المدخل","لماذا تأخرت العلوم الإنسانية؟","ساد في القرون 17 و18 و19 اعتقاد أن العلم مرتبط بالعلوم الطبيعية فقط، ثم <b>دخلت الظاهرة النفسية المختبر</b> وانتشر التجريب.<br>فتأخر ظهور علم النفس والاجتماع والاقتصاد <b>لتأخر استعمال المنهج العلمي فيها</b>، لأن الظواهر الاجتماعية متغيرة، والباحث طرف فيها، والتجريب على الإنسان صعب."],
[4,"الخصائص","الخصائص السبع بمصطلحاتها","• الموضوعية <b>objectivity</b><br>• الهدف <b>Purposiveness</b><br>• الإثبات والتكرار <b>verification and replicability</b><br>• التعميم: من الحكم الجزئي إلى الكلي، ومن العينة للمجتمع<br>• التنبؤ <b>Predictability</b>: أكبر في البحوث الكمية والنماذج القياسية<br>• التراكمية: يبدأ من حيث انتهى الآخرون ← أهمية الدراسات السابقة<br>• التنظيم: ملاحظة ← فرضيات ← اختبار ← تعميم"],
[4,"الخصائص","تفاصيل الأركان الأربعة","• <b>الموضوع:</b> ظاهرة أو مشكلة تتحدى تفكير الباحث؛ يستمد قوته من أهميته وسده للفجوات في الأدبيات.<br>• <b>الهدف:</b> موضوعي ذو قيمة وأثر في حياة الناس، ويحقق إضافة جديدة.<br>• <b>المنهجية:</b> قواعد وإجراءات توصل لنتائج سليمة يمكن تعميمها والتحقق منها بالتكرار.<br>• <b>الشكل:</b> صيغة الكتابة وتنظيمها وفق العرف العلمي، بلا إسهاب مطول ولا اختصار مخل."],
[4,"الأخلاقيات","بقية الأخلاقيات وتمييزها","• <b>العمل الدقيق المنظم:</b> تجنب العشوائية والتسرع، وتوثيق البيانات في ملفات مستقلة.<br>• <b>الحياد:</b> خصوصًا في مناقشة النتائج وعرضها.<br>• <b>النشر المسؤول:</b> نشر الأصيل المفيد في مجلات محكمة موثوقة.<br>• <b>الالتزام بالشرع والأعراف:</b> لا موضوع يخالف القيم أو الشرائع.<br><b>لا تخلط:</b> «الأمانة» خُلق في الأخلاقيات، وصفة في الباحث أيضًا."],
[4,"أنواع البحوث","النظرية والتطبيقية: علاقة تكامل","قد يصعب الفصل بينهما:<br>• التطبيقية تعتمد غالبًا على النظرية في <b>بناء الفرضيات والإطار النظري</b>.<br>• والنظرية تستفيد من نتائج التطبيقية في <b>تطوير النظريات وبنائها</b>.<br>والنظرية تمكّن الباحث من صياغة الفروض العلمية صياغة دقيقة."],
[4,"أنواع البحوث","البحث التفسيري والمتغيرات","• يبحث في سؤال <b>لماذا؟</b> بفروض سببية، وهو <b>أدق وأقل مرونة وأكثر إحكامًا</b> من الاستطلاعي والوصفي.<br>• يكمل مهمة الوصفي: الوصفي يكشف الظاهرة، والتفسيري يمد العلوم بالقوانين والنظريات.<br>• الظاهرة المدروسة = <span class='k'>المتغير التابع</span>، وما تعتمد عليه = <span class='k'>المتغير المستقل</span> الذي يسبقه."],
[4,"أنواع البحوث","نشأة البحث النوعي وصعوبته","• نشأ في <b>العلوم الاجتماعية في القرن الماضي</b> ردةَ فعل لغلبة البحوث الإحصائية.<br>• في المجال التربوي ظهر في <b>بريطانيا منذ ستينات القرن الماضي</b>، ثم انتقل إلى الاجتماع والسياسة.<br>• من صعوباته: قدرات الباحثين، لتأثرهم بالمنهج الكمي.<br>• يجيب عن: كيف؟ ولماذا؟ وما الغاية؟"],
[4,"المناهج","البحث المسحي بالتفصيل","يصف الظاهرة وانتشارها في مجتمع معين باستجواب أفراده أو عينة كبيرة.<br><b>أمثلته:</b> متوسط الدخل والعادات الاستهلاكية، عدد المدخنين بين الشباب.<br><b>لا يبحث العلاقات ولا الأسباب</b>؛ يقيس حجم المشكلة ليُبنى عليه لاحقًا.<br><b>لا تخلط:</b> المسحي للحاضر والتاريخي للماضي؛ والمسحي لا يتدخل في الأحداث، والتجريبي يجري في ظروف مصطنعة ويتحكم بالمتغير."],
[4,"المناهج","دراسة الحالة وبقية أنواع الوصفي","• <b>دراسة الحالة case study:</b> معلومات كافية عن حدث أو مؤسسة بالانغماس والرصد والمقابلات المكثفة؛ <b>أعمق وأدق من المسحي</b>؛ تكثر في الطب وعلم النفس. مثالها: قرارات منظمة، أسباب فشل مشروع.<br>• <b>التتبعي Longitudinal:</b> التغير والنمو عبر الزمن.<br>• <b>الارتباطي:</b> وجود علاقة ومقدارها.<br>• <b>الميداني:</b> المعايشة والملاحظة.<br>• <b>تحليل المحتوى:</b> رصد تكرار الموضوعات والكلمات."],
[4,"المناهج","أمثلة اقتصادية للمناهج","• <b>الوصفي:</b> أنماط إنفاق الأسر في المدن الكبرى (إسكان، طعام، نقل، ترفيه)؛ قد يجد أن مرتفعي الدخل ينفقون نسبة أكبر على الترفيه والسفر، ومنخفضيه على الغذاء والسكن.<br>• <b>التاريخي:</b> ارتفاع أسعار النفط وتقلباتها: خفض الإنتاج وزيادته، والطلب، واحتكار الشركات، وانخفاض الاحتياطيات."],
[4,"المناهج","مثال شبه تجريبي: الحد الأدنى للأجور","١) <b>التصميم:</b> مدن تُرفع فيها الأجور (تجريبية) وأخرى تبقى كما هي (ضابطة).<br>٢) <b>جمع البيانات:</b> البطالة قبل وبعد، مع ساعات العمل ودخل العمال وتكاليف التشغيل.<br>٣) <b>النتائج:</b> إن ارتفعت البطالة في التجريبية مقارنة بالضابطة قيل بعلاقة سببية بين رفع الحد الأدنى وزيادة البطالة."],
[4,"المناهج","لماذا ظهر «شبه التجريبي»؟","لأن أهم عقبات التجريب في العلوم السلوكية <b>ضبط المتغيرات</b>؛ فالظواهر الإنسانية <b>غير مادية ومتداخلة</b> يصعب عزلها.<br>أما التجارب المختبرية فمتغيراتها مادية تقاس بأدوات فيها التقنين والصدق والثبات.<br>والفرق بين التجريبي وشبه التجريبي: <b>درجة التحكم والضبط</b> للعوامل المؤثرة."],
[4,"الموضوع والمشكلة","فوائد قراءة الدراسات السابقة","١) فكرة عن الموضوعات الجديرة بالبحث وأهميتها<br>٢) اكتشاف النقص، والتوصيات والمقترحات البحثية<br>٣) معرفة ما بُحث (تراكمية العلم)<br>٤) التعرف على المشكلات المعاصرة<br>٥) الإفادة من إجراءاتها المنهجية<br>٦) بناء المسلمات والفرضيات واستكمال ما قصرت عنه<br>٧) بلورة المشكلة وتحديد أبعادها"],
[4,"الموضوع والمشكلة","مصادر الأفكار وموضوع سبق بحثه","<b>مصادر الأفكار:</b> البحوث في المجلات المحكمة · رسائل الماجستير والدكتوراه · أبحاث الندوات والمؤتمرات · التقارير والنشرات الإحصائية · الخبرة العملية · مناقشة الخبراء.<br><b>موضوع سبق بحثه:</b> يجوز إن تغيرت الظروف، أو استجدت عوامل، أو بزاوية أو معالجة منهجية جديدة، أو دراسة أعمق. الممنوع: النقل والتقليد وإعادة الإخراج والترجمة <b>بلا إضافة</b>."],
[4,"الموضوع والمشكلة","مثالا الصياغة التقريرية والاستفهامية","<b>تقريرية (قمعية):</b> ارتفاع التضخم ← تراجع القوة الشرائية للأسر متوسطة الدخل ← بسبب ارتفاع أسعار الأساسيات ← وقلة الدراسات ← الحاجة لبحث يحلل التأثير.<br><b>استفهامية:</b> ما تأثير التضخم على القوة الشرائية للأسر ذات الدخل المتوسط؟ وفرعيًا: كيف يؤثر على إنفاقها؟ إلى أي مدى تتكيف؟ ما القطاعات الأكثر تأثرًا؟ هل للسياسات الحكومية دور في التخفيف؟"],
[4,"الموضوع والمشكلة","أمثلة أنواع أسئلة البحث ومثال العنوان","• <b>وصفي:</b> ما واقع استخدام مواقع التسوق الإلكتروني في السعودية؟ ← إحصاء وصفي<br>• <b>ارتباط:</b> هل توجد علاقة بين جودة خدمات الشركة وحجم مبيعاتها؟ ← إحصاء استدلالي<br>• <b>تأثير:</b> هل يؤثر وجود إطار للحوكمة الشرعية في المصرف الإسلامي على حجم التعاملات؟<br><b>عنوان نموذجي:</b> تأثير المستوى التعليمي على قرار الاستثمار: دراسة قياسية تحليلية على موظفي القطاع العام في المملكة."],
[4,"المتغيرات","أهمية المتغيرات وتمييز المستقل من التابع","<b>أهميتها:</b> التابع أساس تحديد المشكلة · المستقل منطلق كل فرضية · كلاهما منطلق البحث عن الدراسات السابقة ومناقشتها · عليها يُبنى اختيار الفرضيات · وهي محور <b>المستخلص</b>.<br><b>لا تخلط:</b> الباحث يحدد المستقل والتابع بأهدافه، فقد يكون المتغير مستقلًا في بحث وتابعًا في آخر. وترتيبهما في الصياغة لا يهم، لكن المستقل <b>يسبق</b> التابع، والتابع ليس تحت سيطرة الباحث."],
[4,"الفرضيات","أهمية الفرضيات ومصادرها","<b>أهميتها:</b> توجه جمع البيانات بدقة · مؤشر لما ينبغي أن تكون عليه النتيجة · تحدد الإجراءات والأساليب · تفسر العلاقات بين المتغيرات.<br><b>مصادرها:</b><br>• النظريات (رفض الفرضية يعني تعديل النظرية، وقبولها يؤكد صحتها)<br>• الدراسات السابقة<br>• خبرة الباحث ومنطقه<br>• ثقافة المجتمع العلمي"],
[4,"الفرضيات","الفرضية والسؤال والتساؤل","• <b>الفرضية:</b> عبارة <b>تنبؤية</b> تتضمن توقعًا محددًا للعلاقة.<br>• <b>السؤال:</b> يشبهها لكنه بلا توقع محدد.<br>• <b>التساؤل:</b> أضعف من السؤال ومرحلة قبله؛ الباحث لا يعرف هل العلاقة موجودة.<br>إذن: الفرضيات <b>ليست ضرورية دائمًا</b>، ويتوقف استعمالها على نوع الدراسة."],
[4,"أهمية البحث وحدوده","أهمية البحث وحدوده","<b>الأهمية:</b> جواب «لماذا هذا البحث؟»؛ <b>علمية</b> (الإضافة للنظرية والتخصص) و<b>عملية</b> (الفائدة للمنظمات والمجتمع). تذكر: أسباب الدراسة، النتائج المتوقعة، الفائدة التطبيقية.<br><b>الحدود:</b> موضوعية · مكانية (جغرافية) · زمانية. وهي تعبير صادق عن <b>الأمانة العلمية</b>، إذ قد لا تُعمم النتائج خارجها."],
[4,"مصادر المعرفة","العلم والمعرفة والاتجاهات المنحرفة","<b>فروق العلم عن المعرفة:</b> محدد بمجال · قائم على الأدلة · قابل للاختبار؛ والمعرفة أوسع وقد تُبنى على معتقدات ولا تقبل الاختبار (دينية، فلسفية).<br><b>الاتجاهات التي ضيقت مصادر التلقي:</b><br>• <b>الحسي:</b> حصرها في الحس، وما لا انطباع حسي له وهم.<br>• <b>العقلي:</b> العقل وحده وتجاهل الحواس.<br>• <b>الحدسي:</b> نفى العقل والحواس وجعلها بالحدس."],
[4,"مصادر المعرفة","الوحي: ما يختص به","معرفة <b>يقينية مطلقة</b> لأنه جزء من علم الله.<br><b>اختص بـ:</b> أحكام الحلال والحرام · أخبار اليوم الآخر · مصير الإنسان بعد الموت · حقيقة الروح · علم الساعة.<br>ليس نصوصًا إخبارية تُقبل بالعاطفة، بل <b>متضمن للدلالة العقلية</b>؛ والدليل الشرعي لا يُقابل بالعقلي بل <b>بالدليل البدعي</b>."],
[4,"مصادر المعرفة","العقل: إثبات مجمل لا مفصل، ومعنى لا كيفية","• إثبات العقل للغيب المتعقل <b>مجمل</b>، والتفصيل يختص به الوحي.<br>• ويثبت <b>المعنى لا الكيفية</b>؛ لذا ضرب الله الأمثال: استدل على النشأة الآخرة بالأولى، وعلى البعث بإحياء الأرض الميتة.<br>• ويدل على الغيب المحض دلالة غير مباشرة: <b>بإثبات النبوة</b>، فيلزم تصديق النبي فيما أخبر.<br>• وقد يغلبه الهوى: إباحة الخمر في الغرب مع مفاسدها لغلبة مبدأ الحرية الفردية."],
[4,"مصادر المعرفة","العلاقة بين المصادر الثلاثة","<b>العقل والنقل:</b> تكامل؛ لا تعارض بين قطعيين. إن تعارض ظني وقطعي قُدِّم <b>القطعي</b> (عقليًا أو نقليًا)، وإن كانا ظنيين طُلب <b>الترجيح</b>. وأوسع المصادر النقل.<br>قال ابن تيمية: «صريح المعقول لا يعارض صحيح المنقول».<br><b>العقل والحس:</b> كلٌّ مفتقر للآخر؛ الحس ينقل المعطيات، والعقل يؤلف ويجرّد ويعمم. و<b>الخبر بعد العقل والحس</b>."],
[4,"مصادر الاقتصاد الإسلامي","آيات القواعد الاقتصادية في القرآن","وضع القرآن قواعد عامة ثابتة وترك تفصيلها للسنة والاجتهاد:<br><span class='v'>﴿وَأَحَلَّ اللَّهُ الْبَيْعَ وَحَرَّمَ الرِّبَا﴾</span> (البقرة: 275)<br><span class='v'>﴿يَا أَيُّهَا الَّذِينَ آمَنُوا لَا تَأْكُلُوا أَمْوَالَكُم بَيْنَكُم بِالْبَاطِلِ إِلَّا أَن تَكُونَ تِجَارَةً عَن تَرَاضٍ مِّنكُمْ﴾</span> (النساء: 29)<br><span class='v'>﴿يَا أَيُّهَا الَّذِينَ آمَنُوا أَوْفُوا بِالْعُقُودِ﴾</span> (المائدة: 1)<br>واستثناءً فصّل المواريث: <span class='v'>﴿يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ﴾</span> (النساء: 11) ← مرونة وفتح لباب الاجتهاد."],
[4,"مصادر الاقتصاد الإسلامي","السنة والاجتهاد","<b>السنة:</b> ما ثبت عن النبي صلى الله عليه وسلم من قول أو فعل أو تقرير، المصدر الثاني:<br><span class='v'>﴿وَمَا آتَاكُمُ الرَّسُولُ فَخُذُوهُ وَمَا نَهَاكُمْ عَنْهُ فَانتَهُوا﴾</span> (الحشر: 7)<br><span class='v'>﴿فَلَا وَرَبِّكَ لَا يُؤْمِنُونَ حَتَّىٰ يُحَكِّمُوكَ فِيمَا شَجَرَ بَيْنَهُمْ﴾</span> (النساء: 65)<br>تأتي <b>مؤكدة أو مفصلة أو منشئة</b>؛ وجاءت بالبيع والرهن والشركات والإجارة.<br><b>الاجتهاد:</b> لاستنباط حكم ما لا نص فيه، مستندًا إلى الأصول الثابتة."],
[4,"مصادر الاقتصاد الإسلامي","كتب التراث والخبرات الإنسانية","<b>المتخصصة:</b> الخراج لأبي يوسف · الأموال لأبي عبيد · أحكام السوق ليحيى بن عمر · الحسبة لابن تيمية · الاكتساب في الرزق المستطاب للشيباني · الأحكام السلطانية للماوردي · التيسير في أحكام التسعير للمجيلدي · الطرق الحكمية لابن القيم.<br><b>أخرى:</b> فلسفية (الفارابي، ابن سينا، الغزالي) وتاريخية (المقريزي، ابن خلدون) والتراجم.<br><b>الخبرات الإنسانية النافعة:</b> بشرط ألا تعارض الشريعة؛ «الحكمة ضالة المؤمن»."],
[4,"جمع البيانات","أي أداة لأي معلومة؟","<b>عوامل الاختيار:</b> طبيعة المشكلة · الهدف · نوع المنهجية · ملاءمة الطريقة · المجتمع والعينة · المال والوقت · معرفة الباحث بالأداة. ولا يخضع لذوقه.<br>• العقائد والاتجاهات ← <b>المقابلة والاستبانة</b><br>• السلوك الفعلي ← <b>الملاحظة</b><br>• الماضي ← <b>الوثائق والسجلات</b><br>• مقاومة المبحوثين ورفضهم ← <b>الملاحظة</b><br>والتاريخي يعتمد الثانوية، والمسحي يعتمد الأولية."],
[4,"جمع البيانات","المقابلة مقابل الاستبانة","<table><tr><th></th><th>المقابلة</th><th>الاستبانة</th></tr><tr><td>أسئلتها</td><td>مفتوحة، شبه مفتوحة، مغلقة</td><td>مغلقة، مفتوحة، مختلطة</td></tr><tr><td>مزاياها</td><td>بيانات غنية، لغة الجسد، توضيح فوري</td><td>عدد كبير بسرعة، تحليل إحصائي، سرية، تأثير الباحث أقل</td></tr><tr><td>عيوبها</td><td>وقت وتكلفة، عينة صغيرة، «الإجابة الصحيحة»</td><td>لا عمق ولا توضيح، تسرع وملل، استجابة منخفضة</td></tr></table>ومن المقابلة: <b>الجماعية focus group</b> (مجموعة التركيز)."],
[4,"جمع البيانات","الملاحظة والوثائق","<b>الملاحظة:</b> مشاهدة الميدان ورصده وتدوينه؛ داعمة لغيرها، تكثر في الاستكشافية. مزاياها: بيانات مباشرة في البيئة الطبيعية وفهم السياق. عيوبها: وقت وجهد، و<b>التحيز</b> مهدد خطير يُحجَّم بتعدد الملاحظين، وصعوبة التعميم.<br><b>الوثائق:</b> المكتوب أو المسجل أو المرسوم: رسمية (تقارير سنوية)، شخصية (مذكرات)، كتب ودوريات ورسائل وأفلام وأرشيف؛ مهمة في <b>المراحل الأولى</b>."],
[4,"جمع البيانات","أنواع الصدق وألفا كرونباخ","<b>الصدق:</b> المحتوى · الظاهري (صدق المحكمين: متخصصو المناهج ومتخصصو الموضوع) · البناء Construct (بالتجانس الداخلي ومعاملات الارتباط).<br><b>الثبات:</b> الاختبار وإعادته Test/Retest · التجزئة النصفية Split half · ألفا كرونباخ:<br>أقل من 0.60 ضعيف · 0.60–0.70 مقبول · 0.70–0.80 جيد · 0.80 فأكثر ممتاز.<br><b>العلاقة:</b> الصادق تمامًا ثابت، وغير الثابت لا يكون صادقًا، والثبات وحده لا يكفي. والدراسة الاستطلاعية Pilot على 30–150."],
[4,"العينات","مصطلحات المعاينة وشروط العينة","• <b>المستهدف</b> مقابل <b>مجتمع المعاينة</b> (المتاح المحدد بزمان ومكان).<br>• <b>إطار المعاينة:</b> قائمة بكل الوحدات، حديث شامل كافٍ.<br>• <b>وحدة المعاينة:</b> أجزاء المجتمع غير المتداخلة.<br>• <b>وحدة التحليل:</b> ما تُستخلص منه النتائج.<br><b>شروط العينة:</b> تجانس مع المجتمع · تكافؤ الفرص · عدم التحيز · تناسب العدد.<br><b>الحصر الشامل</b> هو الوحيد في التعدادات."],
[4,"العينات","حجم العينة وقواعده","<b>قواعد الخبرة:</b> 5% فأكثر في المسحية · 30 فردًا لكل متغير في الارتباطية · 10 أضعاف المتغيرات في الانحدار المتعدد · لا يقل عن 30 لكل طبقة.<br><b>الإحصائية:</b> معادلات بثقة 95% أو 99% · جدول <b>كريجسي ومورغان</b> · SPSS.<br><b>تنبيهات:</b> كلما زاد التباين زاد الحجم · تقل نسبة العينة كلما كبر المجتمع · العشوائية لا تضمن التمثيل · زد <b>40–50%</b> لتفادي نقص الاستجابة."],
[4,"العينات","لا تخلط: الحصصية والطبقية","كلتاهما تقسم المجتمع إلى فئات أو شرائح بمعيار معين، لكن:<br>• في <b>الطبقية</b> الاختيار من كل طبقة <b>عشوائي</b>، والباحث لا يختار كما يريد.<br>• في <b>الحصصية</b> يختار الباحث الأفراد <b>بنفسه</b>، لعدم توفر إطار للمعاينة.<br>مثال الحصصية: 100 فرد بخاصيتين (المؤهل: أقل من جامعي/جامعي × الحالة: يعمل/لا يعمل) = 4 حصص."],
[4,"التحليل","الارتباط والانحدار","<b>الارتباط correlation:</b> يقيس اتجاه العلاقة وقوتها بين −1 و+1 (السالب عكسية، الموجب طردية)، بغض النظر عن المستقل والتابع؛ بيرسون وسبيرمان. <b>والارتباط لا يعني السببية</b> فقد يسببه متغير ثالث.<br><b>الانحدار الخطي:</b> يقوم على <b>علاقة سببية</b> ومقدار التأثير، ويتنبأ بقيمة التابع إذا عُلمت قيمة المستقل."],
[4,"التحليل","مراحل تحليل النوعي والكمي","<b>النوعي:</b> تنظيم البيانات ← تصنيفها (coding) ← تسجيل الملاحظات بالقراءة المتكررة ← تحديد الأنساق والأنماط ← صياغة النتائج.<br><b>الكمي:</b> ١) تنظيم وعرض: جداول وتوزيع تكراري (مدرج، مضلع، منحنى) ٢) وصف: جدولة، رسوم (Bar، Pie، Histogram)، مقاييس ٣) تحليل: اختبار الفروض.<br>والإحصاء الوصفي <b>يلتزم حدود البيانات المتاحة</b> ولا يتخطاها."],
[4,"التحليل","تفسير النتائج ومبادئه","التفسير جهد عقلي يكشف إجابة الأسئلة وقبول الفرضيات، ويربطها بالدراسات السابقة والنظريات، وتُبنى عليه <b>التوصيات</b>. قد يختلف الباحثون في تفسير النتيجة الواحدة، فتلزم الموضوعية.<br><b>مبادئه:</b> ربط النتائج بالمشكلة · وبالأسئلة والأهداف · تعليل قبول الفرضيات أو رفضها · تجنب استنتاج لا تدعمه البيانات · التدعيم بالنظريات والدراسات."],
[4,"التوثيق","أشكال الاقتباس وأنظمة التوثيق","• <b>النصي:</b> بلفظه؛ ≤ 40 كلمة بين علامتي تنصيص، وأكثر من 40 بلا تنصيص بخط أصغر وتضييق السطور وهوامش جانبية؛ والمحذوف يوضع مكانه (...).<br>• <b>بالتلخيص:</b> أفكار صفحات بأسلوب الباحث ثم الإحالة.<br>• <b>بإعادة الصياغة:</b> لتوضيح الصعب وتقليل النصوص.<br><b>الأنظمة:</b> MLA · شيكاغو · هارفارد · <b>APA</b> (الشائع في العلوم الاجتماعية)."],
[4,"التوثيق","ضوابط الجامعة الإسلامية وقائمة المراجع","<b>الحاشية:</b> القرآن: السورة ورقم الآية، بالرسم العثماني · الحديث: نصه في المتن، وفي الهامش الكتاب والتاريخ والجزء والصفحة، ودرجته إن كان في غير الصحيحين · المكرر: «المرجع السابق» مع الصفحة.<br><b>قائمة المراجع:</b> العربية ثم الأجنبية · هجائيًا بلقب المؤلف الأول (لا تُحتسب «ال» ولا «ابن») · الأقدم أولًا للمؤلف نفسه · كل المؤلفين في القائمة و«وآخرون» في الهامش · لا يُذكر مرجع لم يُستعمل."]
];

const KEY='manahij-bahth-cards-v1';
const CARDS={};LEVELS.forEach(l=>{CARDS[l.n]=[];});
C.forEach(c=>{const L=c[0];CARDS[L].push({id:'L'+L+'-'+(CARDS[L].length+1),lv:L,ch:c[1],t:c[2],b:c[3]});});
LEVELS.forEach(l=>l.total=CARDS[l.n].length);
let S={done:{},level:1,order:{}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);S=Object.assign(S,p);}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let hist=[],cur=null,view='card';
const $=id=>document.getElementById(id);
function order(L){const ids=CARDS[L].map(c=>c.id);let o=(S.order[L]||[]).filter(i=>ids.includes(i));ids.forEach(i=>{if(!o.includes(i))o.push(i)});S.order[L]=o;return o;}
function byId(id){const L=+id.split('-')[0].slice(1);return CARDS[L].find(c=>c.id===id);}
function doneCount(L){return CARDS[L].filter(c=>S.done[c.id]).length;}
function complete(L){return doneCount(L)===CARDS[L].length;}
function unlocked(L){return L===1||complete(L-1);}
function nextCard(L){return order(L).find(i=>!S.done[i])||null;}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1600);}
function renderTop(){
 const tot=C.length,d=Object.keys(S.done).filter(k=>S.done[k]&&byId(k)).length;
 $('totTxt').textContent=d+' / '+tot;$('totBar').style.width=(d/tot*100)+'%';
 $('levels').innerHTML=LEVELS.map(l=>{const dc=doneCount(l.n),lk=!unlocked(l.n),cm=complete(l.n);
  return `<button class="lv ${S.level===l.n?'on':''} ${lk?'lock':''}" data-l="${l.n}">${cm?'<span class="badge">✓</span>':''}<small>${lk?'🔒 ':''}المستوى ${l.n}</small><b>${l.name}</b><span>${dc} / ${l.total}</span><div class="bar"><i style="width:${dc/l.total*100}%"></i></div></button>`}).join('');
 document.querySelectorAll('.lv').forEach(b=>b.onclick=()=>{const L=+b.dataset.l;if(!unlocked(L)){toast('أكمل المستوى السابق أولًا');return;}S.level=L;save();hist=[];cur=null;show();});
}
function show(id){
 const L=S.level;renderTop();
 if(id){cur=id;}else{cur=nextCard(L);}
 if(!cur){finish(L);return;}
 const c=byId(cur),o=order(L),i=CARDS[L].findIndex(x=>x.id===cur)+1,left=CARDS[L].length-doneCount(L),isD=!!S.done[cur];
 $('main').innerHTML=`<div class="card"><div class="cin"><div class="meta"><span class="chap">${c.ch}</span><span class="pos">المستوى ${L} · بطاقة ${i} من ${CARDS[L].length} ${isD?'<span class="done-tag">✓ تمت</span>':''}</span></div>
 <h2>${c.t}</h2><div class="body">${c.b}</div>
 <div class="acts"><button class="ok" id="ok">${isD?'التالية ←':'✓ تم، فهمتها'}</button><button class="later" id="later">${isD?'إلغاء تم':'لاحقًا'}</button></div>
 <div class="sub"><button class="link" id="prev" ${hist.length?'':'disabled'}>→ السابقة</button><span>بقي ${left} في هذا المستوى</span></div></div></div>`;
 $('ok').onclick=()=>{if(!S.done[cur]){S.done[cur]=true;save();toast('أحسنت 👏');}hist.push(cur);show();};
 $('later').onclick=()=>{if(S.done[cur]){delete S.done[cur];save();toast('أُلغيت العلامة');show(cur);return;}const o=order(L);S.order[L]=o.filter(x=>x!==cur).concat(cur);save();hist.push(cur);const n=S.order[L].find(x=>!S.done[x]&&x!==cur)||cur;show(n);};
 $('prev').onclick=()=>{const p=hist.pop();if(p)show(p);};
 window.scrollTo({top:0,behavior:'smooth'});
}
function finish(L){
 const last=L===LEVELS.length;
 $('main').innerHTML=`<div class="card"><div class="finish"><div class="em">${last?'🏆':'🎉'}</div><h2 style="color:var(--teal);font-size:22px">${last?'أتممت المقرر كاملًا!':'أتممت المستوى '+L+': '+LEVELS[L-1].name}</h2>
 <p>${last?'راجعت 100 بطاقة على أربعة مستويات. بارك الله في علمك.':'انفتح لك المستوى التالي: «'+LEVELS[L].name+'».'}</p>
 ${last?'':'<button class="ok" id="nextL">انتقل إلى المستوى التالي ←</button>'}<button class="later" style="width:100%" id="rev">راجع بطاقات هذا المستوى</button></div></div>`;
 if(!last)$('nextL').onclick=()=>{S.level=L+1;save();hist=[];show();};
 $('rev').onclick=()=>{hist=[];show(order(L)[0]);};
 renderTop();
}
function openSheet(){const L=S.level;$('shTitle').textContent='المستوى '+L+' · '+LEVELS[L-1].name;
 $('shList').innerHTML=CARDS[L].map((c,i)=>`<button class="it ${S.done[c.id]?'d':''} ${cur===c.id?'cur':''}" data-id="${c.id}"><span class="st">${S.done[c.id]?'✓':''}</span><span>${i+1}. ${c.t}<small>${c.ch}</small></span></button>`).join('');
 document.querySelectorAll('.it').forEach(b=>b.onclick=()=>{closeSheet();if(cur)hist.push(cur);show(b.dataset.id);});
 $('confirm').classList.remove('show');$('sheet').classList.add('show');$('sheetBg').classList.add('show');}
function closeSheet(){$('sheet').classList.remove('show');$('sheetBg').classList.remove('show');}
$('menuBtn').onclick=openSheet;$('shClose').onclick=closeSheet;$('sheetBg').onclick=closeSheet;
$('resetBtn').onclick=()=>$('confirm').classList.add('show');
$('no').onclick=()=>$('confirm').classList.remove('show');
$('yes').onclick=()=>{const L=S.level;CARDS[L].forEach(c=>delete S.done[c.id]);delete S.order[L];save();hist=[];closeSheet();toast('أُعيد تعيين المستوى');show();};
if(!unlocked(S.level))S.level=1;
show();
</script></body></html>
